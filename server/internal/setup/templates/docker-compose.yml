name: nethub
services:
  postgres:
    image: nethub-postgres-local:dev
    build:
      context: ..
      dockerfile: deploy/images/postgres/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_bootstrap
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - database:/var/lib/postgresql/data
      - ./00-nethub-roles.sh:/docker-entrypoint-initdb.d/00-nethub-roles.sh:ro
      - ./secrets/postgres:/run/secrets:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d nethub"]
      interval: 2s
      timeout: 2s
      retries: 45
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  migrate:
    image: nethub-local:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: [migrate, --password-file, /run/secrets/pg_nethub_owner, --sslmode, disable]
    volumes:
      - ./secrets/migrate:/run/secrets:ro
    networks: [database]
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  nethub-web:
    image: nethub-local:dev
    volumes:
      - ./secrets/web:/run/secrets:ro
    networks: [database, edge]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /nethub, doctor, --health-url, "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  nethub-authz:
    image: nethub-local:dev
    volumes:
      - ./secrets/authz:/run/secrets:ro
      - ./runtime/trust:/run/trust:ro
    networks: [database, edge]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /nethub, doctor, --health-url, "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  frps:
    image: nethub-frps-local:dev
    environment: {TZ: UTC}
    build:
      context: ..
      dockerfile: deploy/images/frps/Dockerfile
    command: [-c, /run/secrets/frps.toml]
    network_mode: host
    volumes:
      - ./secrets/frps:/run/secrets:ro
      - ./runtime/relay:/run/relay:ro
    depends_on:
      nethub-authz: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  admin-bootstrap:
    image: nethub-local:dev
    profiles: [bootstrap]
    entrypoint: [/nethub, admin, create, --owner-password-file, /run/secrets/pg_nethub_owner, --sslmode, disable]
    command: []
    volumes:
      - ./secrets/migrate:/run/secrets:ro
    networks: [database]
    depends_on:
      migrate: {condition: service_completed_successfully}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  caddy:
    image: nethub-caddy-local:dev
    build:
      context: ..
      dockerfile: deploy/images/caddy/Dockerfile
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      nethub-web: {condition: service_healthy}
      nethub-authz: {condition: service_healthy}
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
networks:
  database: {internal: true}
  edge: {}
volumes:
  database: {}
  caddy-data: {}
  caddy-config: {}

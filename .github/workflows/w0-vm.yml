name: W0 VM preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/w0-vm.yml
      - weekend0/vm_preflight.py

permissions: {}

concurrency:
  group: w0-vm-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opnsense-boot:
    name: isolated OPNsense boot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check host resources
        run: |
          test -c /dev/kvm
          test "$(awk '/MemAvailable/ {print int($2 / 1024)}' /proc/meminfo)" -ge 4500
          sudo chmod a+rw /dev/kvm
          echo "KVM is available; the guest will receive 3072 MiB."

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y qemu-system-x86

      - name: Verify and boot the release image
        run: python3 -I weekend0/vm_preflight.py --output "$RUNNER_TEMP/w0-vm"

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opnsense-boot-evidence
          path: |
            ${{ runner.temp }}/w0-vm/summary.json
            ${{ runner.temp }}/w0-vm/serial-redacted.log
          if-no-files-found: ignore
          retention-days: 7

name: Recovery network diagnosis
on:
  push:
    branches:
      - test/recovery-network-diagnosis
    paths:
      - .github/workflows/recovery-network.yml
      - tools/recovery_network_probe.py
      - tools/test_recovery_network_probe.py
  workflow_dispatch:
permissions: {}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NETHUB_SOURCE_HEAD: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check closed diagnostic boundaries
        run: python3 -B -m unittest discover -s tools -p test_recovery_network_probe.py -v
      - name: Prepare isolated hosted tools
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -c /dev/kvm
          test "$(awk '/MemAvailable/ {print int($2 / 1024)}' /proc/meminfo)" -ge 3000
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils gnupg openssh-client
      - name: Diagnose unchanged signed guest without package installation
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_TEMP,NETHUB_SOURCE_HEAD,PYTHONDONTWRITEBYTECODE python3 tools/recovery_network_probe.py
      - name: Retain closed network outcomes only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-network-diagnosis
          path: ${{ runner.temp }}/recovery-network-evidence/result.json
          if-no-files-found: warn
          retention-days: 7

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  control-plane:
    name: Control plane checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    env:
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - name: Build and check console
        working-directory: server/web
        run: |
          npm ci --ignore-scripts
          npm run format:check
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Verify browser flows under strict CSP
        working-directory: server/web
        env:
          NETHUB_UI_EVIDENCE: ${{ runner.temp }}/nethub-ui-evidence
        run: |
          npx playwright install --with-deps chromium
          npm run verify
      - name: Check module integrity and formatting
        run: |
          go mod verify
          test -z "$(gofmt -l cmd internal)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...
      - name: Verify PostgreSQL security boundaries
        run: sh tests/postgres.sh
      - name: Build foundation CLI
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/nethub" ./cmd/nethub

  deployment:
    name: Deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify clean Compose startup and migration failure
        run: sudo sh server/tests/compose.sh

  opnsense-plugin:
    name: OPNsense plugin checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install test runner
        run: python3 -m pip install pytest==8.3.5 jinja2==3.1.6

      - name: Validate plugin sources
        run: python3 -m pytest -q agents/opnsense/plugin/tests

      - name: Verify official frp pins and os-frp version agreement
        run: python3 deploy/frp/check_versions.py

  weekend0-kit:
    name: weekend0 kit checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse TOML configs and check structure
        run: |
          python3 -I - <<'PY'
          from pathlib import Path
          import tomllib

          c = tomllib.loads(Path("weekend0/frpc.toml").read_text(encoding="utf-8"))
          s = tomllib.loads(Path("weekend0/frps.toml").read_text(encoding="utf-8"))
          assert set(c.get("metadatas", {})) == {"device_id", "claim_placeholder"}, "frpc metadatas must be top-level and complete"
          assert "metadatas" not in c["transport"] and "metadatas" not in c["proxies"][0], "frpc metadatas misplaced"
          assert "log" in c and "log" not in c["proxies"][0], "frpc log must be top-level"
          assert c["transport"].get("heartbeatInterval") == 10 and c["transport"].get("heartbeatTimeout") == 30, "frpc heartbeat keys missing"
          assert "log" in s and "log" not in s["httpPlugins"][0], "frps log must be top-level"
          assert s["transport"].get("heartbeatTimeout") == 30, "frps heartbeatTimeout missing"
          assert s["httpPlugins"][0]["ops"] == ["Login", "NewProxy", "NewUserConn", "Ping"], "frps ops changed"
          print("TOML structure OK")
          PY

      - name: Check probe.py syntax
        run: python3 -I -X pycache_prefix="$RUNNER_TEMP/nethub-pycache" -m py_compile weekend0/probe.py

      - name: Check network sample validation and Q2 boundaries
        run: python3 -I -X pycache_prefix="$RUNNER_TEMP/nethub-pycache" -m unittest discover -s weekend0 -p test_network_summary.py

  actionlint:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.0"
          cache: false

      - name: actionlint
        env:
          GOWORK: "off"
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

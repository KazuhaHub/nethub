name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

# Hosted cache egress limits must not stall required checks.
# Dependencies still use their lockfiles and the pinned compiler/runtime.
jobs:
  control-plane:
    name: Control plane checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/.go-version
          cache: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - name: Build and check console
        working-directory: server/web
        run: |
          npm ci --ignore-scripts
          npm run format:check
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Verify browser flows under strict CSP
        working-directory: server/web
        env:
          NETHUB_UI_EVIDENCE: ${{ runner.temp }}/nethub-ui-evidence
        run: |
          # Bound Playwright's nested APT downloads on the hosted runner.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' \
            'Acquire::Retries "2";' \
            'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' \
            'APT::Update::Error-Mode "any";' \
            | sudo tee /etc/apt/apt.conf.d/80-nethub-ci >/dev/null
          npx playwright install --with-deps chromium
          npm run verify
      - name: Save synthetic user-management browser evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: user-management-browser-evidence
          path: |
            ${{ runner.temp }}/nethub-ui-evidence/users-desktop.png
            ${{ runner.temp }}/nethub-ui-evidence/users-desktop-dark.png
            ${{ runner.temp }}/nethub-ui-evidence/users-mobile-dialog.png
            ${{ runner.temp }}/nethub-ui-evidence/users-results.json
          if-no-files-found: error
          retention-days: 7
      - name: Save synthetic invitation browser evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: invitation-browser-evidence
          path: |
            ${{ runner.temp }}/nethub-ui-evidence/invitations-desktop.png
            ${{ runner.temp }}/nethub-ui-evidence/invitations-desktop-dark.png
            ${{ runner.temp }}/nethub-ui-evidence/invitation-mobile-accept.png
            ${{ runner.temp }}/nethub-ui-evidence/invitations-results.json
          if-no-files-found: error
          retention-days: 7
      - name: Save synthetic provider browser evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-browser-evidence
          path: |
            ${{ runner.temp }}/nethub-ui-evidence/providers-desktop.png
            ${{ runner.temp }}/nethub-ui-evidence/providers-desktop-dark.png
            ${{ runner.temp }}/nethub-ui-evidence/providers-mobile-dialog.png
            ${{ runner.temp }}/nethub-ui-evidence/providers-signin.png
            ${{ runner.temp }}/nethub-ui-evidence/providers-results.json
          if-no-files-found: error
          retention-days: 7
      - name: Save synthetic SAML browser evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saml-provider-browser-evidence
          path: |
            ${{ runner.temp }}/nethub-ui-evidence/saml-providers-light.png
            ${{ runner.temp }}/nethub-ui-evidence/saml-providers-dark.png
            ${{ runner.temp }}/nethub-ui-evidence/saml-mobile-dialog.png
            ${{ runner.temp }}/nethub-ui-evidence/saml-mobile-dialog-actions.png
            ${{ runner.temp }}/nethub-ui-evidence/saml-providers-results.json
          if-no-files-found: error
          retention-days: 7
      - name: Check module integrity and formatting
        run: |
          go mod verify
          test "$(go env GOVERSION)" = "go$(cat .go-version)"
          test -z "$(gofmt -l cmd internal)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test and vet
        run: |
          go test -race -count=1 ./...
          go vet ./...
      - name: Verify PostgreSQL security boundaries
        run: sh tests/postgres.sh
      - name: Build foundation CLI
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/nethub" ./cmd/nethub

  vulnerability-check:
    name: Go vulnerability checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/.go-version
          cache: false
      - name: Scan the Linux runtime with the pinned compiler
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          test "$(go env GOVERSION)" = "go$(cat .go-version)"
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Verify and scan rebuilt helper dependencies
        run: |
          test -z "$(gofmt -l ../deploy/images)"
          for helper in caddy postgres frps; do
            (
              cd "../deploy/images/$helper"
              go mod verify
              go mod tidy
              git diff --exit-code -- go.mod go.sum
              target=./...
              if [ "$helper" = postgres ]; then target=github.com/tianon/gosu; fi
              if [ "$helper" = frps ]; then
                target=github.com/fatedier/frp/cmd/frps
                export GOFLAGS=-tags=frps,noweb
              fi
              GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 "$target"
              if [ "$helper" = frps ]; then
                GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -p 2 -trimpath -o "$RUNNER_TEMP/frps-scan" "$target"
                go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "$RUNNER_TEMP/frps-scan"
              fi
            )
          done

      - name: Build and scan the actual FreeBSD appliance client
        run: |
          cd ../agents/opnsense/plugin/frpc-build
          test -z "$(gofmt -l tools.go)"
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          GOBIN="$RUNNER_TEMP" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 GOFLAGS=-tags=frpc,noweb \
            "$RUNNER_TEMP/govulncheck" github.com/fatedier/frp/cmd/frpc
          python3 ../frpc_source.py --output "$RUNNER_TEMP/frpc-appliance/frpc"
          "$RUNNER_TEMP/govulncheck" -mode=binary "$RUNNER_TEMP/frpc-appliance/frpc"

  deployment:
    name: Deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - name: Install the deployed-browser test
        working-directory: server/web
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/nethub-deployment-browsers
        run: |
          # Playwright invokes apt itself; bound those nested downloads as well.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' \
            'Acquire::Retries "2";' \
            'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' \
            'APT::Update::Error-Mode "any";' \
            | sudo tee /etc/apt/apt.conf.d/80-nethub-ci >/dev/null
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          sudo timeout --signal=TERM --kill-after=5 120 apt-get install -y --no-install-recommends libnss3-tools
      - name: Verify clean Compose startup and migration failure
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/nethub-deployment-browsers
          NETHUB_SCAN_IMAGES: "1"
          NETHUB_BROWSER_TEST: "1"
          NETHUB_BROWSER_EVIDENCE: ${{ runner.temp }}/nethub-deployed-browser-evidence
          NETHUB_IMAGE_EVIDENCE: ${{ runner.temp }}/nethub-image-evidence
        run: |
          NETHUB_NODE_BINARY="$(command -v node)"
          export NETHUB_NODE_BINARY
          sudo --preserve-env=NETHUB_SCAN_IMAGES,NETHUB_BROWSER_TEST,NETHUB_BROWSER_EVIDENCE,NETHUB_IMAGE_EVIDENCE,NETHUB_NODE_BINARY,PLAYWRIGHT_BROWSERS_PATH sh server/tests/compose.sh
      - name: Save tested images for bounded native acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-images
          path: |
            ${{ runner.temp }}/nethub-image-evidence/images.tar.gz
            ${{ runner.temp }}/nethub-image-evidence/SHA256SUMS
            ${{ runner.temp }}/nethub-image-evidence/images.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Verify deployed two-Dex admission
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/nethub-deployment-browsers
          NETHUB_IMAGE_EVIDENCE: ${{ runner.temp }}/nethub-image-evidence
          NETHUB_OIDC_EVIDENCE: ${{ runner.temp }}/nethub-oidc-browser-evidence
        run: |
          NETHUB_NODE_BINARY="$(command -v node)"
          export NETHUB_NODE_BINARY
          python3 server/tests/test_oidc_compose.py
          node server/web/tests/oidc-callback-test.mjs
          sudo --preserve-env=NETHUB_NODE_BINARY,PLAYWRIGHT_BROWSERS_PATH python3 server/tests/oidc-compose.py "$NETHUB_IMAGE_EVIDENCE" "$NETHUB_OIDC_EVIDENCE"
      - name: Save deployed two-Dex evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployed-two-dex-browser
          path: |
            ${{ runner.temp }}/nethub-oidc-browser-evidence/dex-one-login.png
            ${{ runner.temp }}/nethub-oidc-browser-evidence/dex-two-login.png
            ${{ runner.temp }}/nethub-oidc-browser-evidence/results.json
          retention-days: 7
          if-no-files-found: warn
      - name: Verify deployed Keycloak SAML admission
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/nethub-deployment-browsers
          NETHUB_IMAGE_EVIDENCE: ${{ runner.temp }}/nethub-image-evidence
          NETHUB_SAML_EVIDENCE: ${{ runner.temp }}/nethub-saml-browser-evidence
        run: |
          NETHUB_NODE_BINARY="$(command -v node)"
          export NETHUB_NODE_BINARY
          python3 server/tests/test_saml_compose.py
          sudo --preserve-env=NETHUB_NODE_BINARY,PLAYWRIGHT_BROWSERS_PATH python3 server/tests/saml-compose.py "$NETHUB_IMAGE_EVIDENCE" "$NETHUB_SAML_EVIDENCE"
      - name: Save deployed Keycloak SAML evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployed-keycloak-saml-browser
          path: |
            ${{ runner.temp }}/nethub-saml-browser-evidence/keycloak-alice-login.png
            ${{ runner.temp }}/nethub-saml-browser-evidence/keycloak-bob-login.png
            ${{ runner.temp }}/nethub-saml-browser-evidence/results.json
          retention-days: 7
          if-no-files-found: warn
      - name: Save only masked browser evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployed-console-browser
          path: |
            ${{ runner.temp }}/nethub-deployed-browser-evidence/*.png
            ${{ runner.temp }}/nethub-deployed-browser-evidence/results.json
          retention-days: 7
          if-no-files-found: error

  opnsense-plugin:
    name: OPNsense plugin checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PHP filesystem contract dependencies
        run: |
          # The runner's Azure HTTP mirror can stall while the HTTPS fallback works.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get "${apt_options[@]}" --error-on=any update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends php8.3-cli php8.3-xml

      - name: Install test runner
        run: python3 -m pip install pytest==8.3.5 jinja2==3.1.6 jsonschema==4.25.1

      - name: Validate plugin sources
        env:
          NETHUB_TEST_PHP: /usr/bin/php8.3
        run: python3 -m pytest -q agents/opnsense/plugin/tests agents/opnsense/tests

      - name: Verify official frp pins and os-frp version agreement
        run: python3 deploy/frp/check_versions.py

  weekend0-kit:
    name: weekend0 kit checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse TOML configs and check structure
        run: |
          python3 -I - <<'PY'
          from pathlib import Path
          import tomllib

          c = tomllib.loads(Path("weekend0/frpc.toml").read_text(encoding="utf-8"))
          s = tomllib.loads(Path("weekend0/frps.toml").read_text(encoding="utf-8"))
          assert set(c.get("metadatas", {})) == {"device_id", "claim_placeholder"}, "frpc metadatas must be top-level and complete"
          assert "metadatas" not in c["transport"] and "metadatas" not in c["proxies"][0], "frpc metadatas misplaced"
          assert "log" in c and "log" not in c["proxies"][0], "frpc log must be top-level"
          assert c["transport"].get("heartbeatInterval") == 10 and c["transport"].get("heartbeatTimeout") == 30, "frpc heartbeat keys missing"
          assert "log" in s and "log" not in s["httpPlugins"][0], "frps log must be top-level"
          assert s["transport"].get("heartbeatTimeout") == 30, "frps heartbeatTimeout missing"
          assert s["httpPlugins"][0]["ops"] == ["Login", "NewProxy", "NewUserConn", "Ping"], "frps ops changed"
          print("TOML structure OK")
          PY

      - name: Check probe.py syntax
        run: python3 -I -X pycache_prefix="$RUNNER_TEMP/nethub-pycache" -m py_compile weekend0/probe.py

      - name: Check network sample validation and Q2 boundaries
        run: python3 -I -X pycache_prefix="$RUNNER_TEMP/nethub-pycache" -m unittest discover -s weekend0 -p test_network_summary.py

  actionlint:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/.go-version
          cache: false

      - name: actionlint
        env:
          GOWORK: "off"
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check credential history and exception boundaries
        run: |
          scanner="$RUNNER_TEMP/nethub-gitleaks"
          mkdir "$scanner"
          archive="$scanner/release.tar.gz"
          curl --fail --show-error --silent --location --retry 2 --connect-timeout 10 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$scanner" gitleaks
          python3 tools/check_credentials.py --scanner "$scanner/gitleaks"

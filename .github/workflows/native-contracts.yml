name: Native filesystem contracts

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: native-contracts-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  freebsd-contracts:
    name: FreeBSD source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NETHUB_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind native source manifest
        id: source
        run: python3 agents/opnsense/native_contracts.py prepare --directory .native-evidence
      - name: Execute contracts in isolated FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        env:
          NETHUB_NATIVE_MANIFEST_SHA: ${{ steps.source.outputs.manifest_sha }}
        with:
          release: "15.1"
          arch: x86_64
          mem: "2048"
          cpu: "2"
          sync: rsync
          copyback: "true"
          disable-cache: "true"
          debug-on-error: "false"
          envs: NETHUB_SOURCE_HEAD NETHUB_NATIVE_MANIFEST_SHA PYTHONDONTWRITEBYTECODE
          prepare: |
            set -eu
            export PATH=/usr/local/bin:/usr/local/sbin:$PATH
            env ASSUME_ALWAYS_YES=yes pkg install -y python313 py313-pytest py313-jinja2 py313-jsonschema php85 php85-dom php85-simplexml php85-openssl
          run: |
            set -eu
            export PATH=/usr/local/bin:/usr/local/sbin:$PATH
            export NETHUB_TEST_PHP=/usr/local/bin/php
            python3.13 agents/opnsense/native_contracts.py run --directory .native-evidence
      - name: Verify returned source and every native outcome
        env:
          NETHUB_NATIVE_MANIFEST_SHA: ${{ steps.source.outputs.manifest_sha }}
        run: python3 agents/opnsense/native_contracts.py verify --directory .native-evidence
      - name: Retain only source hashes and bounded native outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-source-contracts
          path: |
            .native-evidence/source.json
            .native-evidence/result.json
          if-no-files-found: error
          retention-days: 7

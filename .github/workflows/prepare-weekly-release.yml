name: Prepare weekly release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allocate release version and prepare source patch
        id: version
        run: |
          set -euo pipefail
          version=$(python3 tools/prepare-weekly-release.py --apply)
          git diff --check
          git diff --binary > "$RUNNER_TEMP/weekly-release.patch"
          test -s "$RUNNER_TEMP/weekly-release.patch"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/weekly-release-base"
          printf 'number=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-release-${{ steps.version.outputs.number }}
          path: |
            ${{ runner.temp }}/weekly-release.patch
            ${{ runner.temp }}/weekly-release-base
          if-no-files-found: error

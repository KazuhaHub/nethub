name: Native appliance preparation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/native-appliance.yml
      - agents/opnsense/acceptance/**

permissions: {}

concurrency:
  group: native-appliance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installed-package:
    name: fresh OPNsense package and page
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      NETHUB_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/native-appliance-browsers
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check isolated hosted resources
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -c /dev/kvm
          test "$(awk '/MemAvailable/ {print int($2 / 1024)}' /proc/meminfo)" -ge 4500
          sudo chmod a+rw /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils openssh-client
      - name: Set up browser runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - name: Install pinned browser dependencies
        working-directory: server/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build and inspect the current package in a signed guest
        run: |
          export NETHUB_NODE_BINARY
          NETHUB_NODE_BINARY="$(command -v node)"
          python3 agents/opnsense/acceptance/bootstrap.py \
            --directory "$RUNNER_TEMP/native-appliance-private" \
            --evidence "$RUNNER_TEMP/native-appliance-evidence"
      - name: Retain only bounded installed-package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-installed-package
          path: |
            ${{ runner.temp }}/native-appliance-evidence/result.json
            ${{ runner.temp }}/native-appliance-evidence/page.json
            ${{ runner.temp }}/native-appliance-evidence/native-page.png
            ${{ runner.temp }}/native-appliance-evidence/native-mobile.png
          if-no-files-found: warn
          retention-days: 7

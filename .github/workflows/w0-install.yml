name: W0 installed VM preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/w0-install.yml
      - weekend0/vm_install_preflight.py
      - weekend0/vm_preflight.py
      - weekend0/terminal-requirements.txt
      - weekend0/test_vm_install_preflight.py

permissions: {}

concurrency:
  group: w0-install-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opnsense-install:
    name: disposable OPNsense install
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check host resources
        run: |
          test -c /dev/kvm
          test "$(awk '/MemAvailable/ {print int($2 / 1024)}' /proc/meminfo)" -ge 4500
          sudo chmod a+rw /dev/kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils

      - name: Install and verify an independent guest boot
        run: |
          python3 -m venv "$RUNNER_TEMP/w0-terminal-venv"
          "$RUNNER_TEMP/w0-terminal-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r weekend0/terminal-requirements.txt
          "$RUNNER_TEMP/w0-terminal-venv/bin/python" -I weekend0/vm_install_preflight.py --output "$RUNNER_TEMP/w0-install"

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opnsense-install-evidence
          path: |
            ${{ runner.temp }}/w0-install/install-summary.json
            ${{ runner.temp }}/w0-install/installer-redacted.log
            ${{ runner.temp }}/w0-install/installed-redacted.log
            ${{ runner.temp }}/w0-install/*-screen-redacted.txt
            ${{ runner.temp }}/w0-install/image/summary.json
          if-no-files-found: ignore
          retention-days: 7
